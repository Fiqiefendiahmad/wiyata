services:
  postgres:
    image: postgres:17-alpine
    container_name: wiyata-postgres
    environment:
      POSTGRES_DB: wiyata
      POSTGRES_USER: wiyata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-dev-password}
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - wiyata-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiyata -d wiyata"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: wiyata-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - wiyata-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mysql:
    image: mariadb:11-jammy
    container_name: wiyata-mysql
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-this-dev-password}
      MARIADB_DATABASE: wiyata_mysql
      MARIADB_USER: wiyata
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:-change-this-dev-password}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - wiyata-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -u wiyata -p${MYSQL_PASSWORD:-change-this-dev-password}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wiyata-backend
    env_file: .env
    environment:
      PLATFORM_DATABASE_URL: postgresql+asyncpg://wiyata:${POSTGRES_PASSWORD:-change-this-dev-password}@postgres:5432/wiyata
      REDIS_URL: redis://redis:6379/0
      API_BASE_URL: https://wiyata.sadeyan.my.id
      APP_BASE_URL: https://wiyata.sadeyan.my.id
    ports:
      - "127.0.0.1:8090:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - wiyata-sandbox-storage:/app/sandbox_storage
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wiyata-frontend
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
    ports:
      - "127.0.0.1:3050:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  wiyata-postgres-data:
  wiyata-redis-data:
  wiyata-mysql-data:
  wiyata-sandbox-storage:
