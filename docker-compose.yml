services:
  postgres:
    image: postgres:17-alpine
    container_name: wiyata-postgres
    environment:
      POSTGRES_DB: wiyata
      POSTGRES_USER: wiyata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-dev-password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - wiyata-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiyata -d wiyata"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: wiyata-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - wiyata-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wiyata-backend
    env_file: .env
    environment:
      PLATFORM_DATABASE_URL: postgresql+asyncpg://wiyata:${POSTGRES_PASSWORD:-change-this-dev-password}@postgres:5432/wiyata
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - wiyata-sandbox-storage:/app/sandbox_storage
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wiyata-frontend
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: wiyata-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  wiyata-postgres-data:
  wiyata-redis-data:
  wiyata-sandbox-storage:
